<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Contact | Ember Roast</title>

    <link rel="stylesheet" href="../css/style.css" />

    <link
      href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:wght@700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <header>
      <nav class="navbar">
        <div class="logo">☕ Ember Roast</div>

        <ul class="nav-links">
          <li><a href="../index.html">Home</a></li>

          <li><a href="./about.html">About</a></li>

          <li><a href="./shop.html">Shop</a></li>

          <li><a href="./contact.html">Contact</a></li>
        </ul>
      </nav>
    </header>

    <section class="page-banner">
      <h1>Contact Us</h1>

      <p>We'd love to hear from you.</p>
    </section>

    <section class="contact-section">
      <form>
        <label>Name</label>

        <input type="text" placeholder="Enter your name" />

        <label>Email</label>

        <input type="email" placeholder="Enter your email" />

        <label>Message</label>

        <textarea rows="6" placeholder="Write your message"></textarea>

        <button class="btn">Send Message</button>
      </form>

      <div class="contact-info">
        <h2>Visit Us</h2>

        <p>
          📍 1 Georgian Drive<br />

          Barrie, Ontario
        </p>

        <p>📞 (705) 555-2026</p>

        <p>✉ contact@emberroast.com</p>

        <p>Open Daily 7:00 AM - 8:00 PM</p>
      </div>
    </section>

    <footer>
      <p>© 2026 Ember Roast Coffee</p>
    </footer>
  </body>
</html>
